[project]
name = "eks-demo-app"
version = "0.1.0"
description = "Sample FastAPI microservice demonstrating the eks-platform-gitops platform"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.pytest.ini_options]
testpaths = ["tests"]
