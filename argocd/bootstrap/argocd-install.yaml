# Minimal bootstrap namespace for ArgoCD itself. The actual ArgoCD controller
# manifests are applied from the upstream stable manifest in scripts/bootstrap.sh
# via:
#   kubectl create namespace argocd
#   kubectl apply -n argocd -f \
#     https://raw.githubusercontent.com/argoproj/argo-cd/v2.12.6/manifests/install.yaml
#
# We deliberately do NOT manage ArgoCD's own install via this repo's Terraform
# or via an ArgoCD Application (see docs/decisions.md for the "who bootstraps
# the bootstrapper" rationale). This file exists to document/pin that namespace
# so it shows up in `kubectl kustomize argocd/bootstrap`.
apiVersion: v1
kind: Namespace
metadata:
  name: argocd
  labels:
    app.kubernetes.io/part-of: eks-platform-gitops
