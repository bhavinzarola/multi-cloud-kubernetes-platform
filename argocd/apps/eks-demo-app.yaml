apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: eks-demo-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/your-org/eks-platform-gitops.git
    targetRevision: main
    path: app/helm/eks-demo-app
    helm:
      valueFiles:
        - values.yaml
        - values-dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: eks-demo-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas # let the HPA own replica count post-sync
