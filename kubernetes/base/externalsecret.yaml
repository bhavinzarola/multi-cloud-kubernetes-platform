apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: eks-demo-app
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-west-1
      auth:
        jwt:
          serviceAccountRef:
            name: eks-demo-app
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: eks-demo-app-secret
  namespace: eks-demo-app
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: eks-demo-app-secret
    creationPolicy: Owner
  data:
    - secretKey: APP_DATABASE_URL
      remoteRef:
        key: eks-demo-app/dev
        property: database_url
