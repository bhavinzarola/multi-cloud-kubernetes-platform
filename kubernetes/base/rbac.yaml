apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eks-demo-app-reader
  namespace: eks-demo-app
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eks-demo-app-reader-binding
  namespace: eks-demo-app
subjects:
  - kind: ServiceAccount
    name: eks-demo-app
    namespace: eks-demo-app
roleRef:
  kind: Role
  name: eks-demo-app-reader
  apiGroup: rbac.authorization.k8s.io
